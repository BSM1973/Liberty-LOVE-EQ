name: LOVE EQ - Windows x64 VST3 + Standalone EXE Installer
# Apple notarized PKG is issued through the trusted ECHO 86 Release Center,
# where the existing Developer ID certificates and Apple notary account live.
on:
  push:
    branches: [main]
    paths:
      - 'Installer/**'
      - '.github/workflows/installers.yml'
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: love-eq-installers-${{ github.ref }}
  cancel-in-progress: false
env:
  LOVE_EQ_VERSION: "0.1.0"
jobs:
  windows-installer:
    name: Windows x64 - VST3 and Standalone EXE installer
    runs-on: windows-2022
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Windows x64
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Compile Windows VST3, Standalone and tests
        shell: pwsh
        run: cmake --build build --config Release --parallel 3
      - name: Run DSP and JUCE UTF-8 tests on Windows
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Build verified Windows EXE with Inno Setup
        shell: pwsh
        run: ./Installer/windows/build_installer.ps1 -Version "$env:LOVE_EQ_VERSION"
      - name: Publish Windows EXE installer (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: LOVE-EQ-Windows-x64-INSTALLER-EXE
          path: release-output/LOVE-EQ-*-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
