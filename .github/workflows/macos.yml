name: Build LOVE EQ (macOS)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dsp-tests:
    name: DSP and 100 preset checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check UI strings and layout contract
        run: python3 tests/validate_ui_text.py
      - name: Compile independent DSP tests
        shell: bash
        run: |
          mkdir -p build-core
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -I Source tests/eqcore_test.cpp -o build-core/eqcore_test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -I Source tests/presets_test.cpp -o build-core/presets_test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -I Source tests/graphic_test.cpp -o build-core/graphic_test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tests/utf8_test.cpp -o build-core/utf8_test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -I Source tests/curvelab_test.cpp -o build-core/curvelab_test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -I Source tests/harmonic_dna_test.cpp -o build-core/harmonic_dna_test
      - name: Test DSP and all factory presets
        shell: bash
        run: |
          ./build-core/eqcore_test
          ./build-core/presets_test
          ./build-core/graphic_test
          ./build-core/utf8_test
          ./build-core/curvelab_test
          ./build-core/harmonic_dna_test

  macos-arm64:
    name: AU / VST3 / Standalone - Apple Silicon
    # Build universal x86_64+arm64 so JUCE VST3 helper can run on the Intel host.
    # macos-15 was cancelled before checkout in two runs (no steps/logs).
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Print macOS runner and Xcode diagnostics
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          cmake --version
      - name: Configure for Apple Silicon
        run: cmake -S . -B build -G Xcode '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64' -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DCMAKE_BUILD_TYPE=Release
      - name: Build AU VST3 Standalone
        run: cmake --build build --config Release --target LoveEQ_All --parallel 3
      - name: Test EQ core and factory presets
        run: |
          cmake --build build --config Release --target loveeq_core_test loveeq_presets_test loveeq_graphic_test loveeq_utf8_test loveeq_curve_lab_test loveeq_harmonic_dna_test
          ctest --test-dir build -C Release --output-on-failure
      - name: Package unsigned test builds
        shell: bash
        run: |
          mkdir -p deliverables
          find build/LoveEQ_artefacts -type d \( -name '*.component' -o -name '*.vst3' -o -name '*.app' \) -prune -exec cp -R {} deliverables/ \;
          test -n "$(ls -A deliverables)"
          ditto -c -k --keepParent deliverables LOVE-EQ-macOS-arm64-unsigned.zip
      - name: Publish downloadable GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOVE-EQ-macOS-arm64-AU-VST3-Standalone-unsigned
          path: LOVE-EQ-macOS-arm64-unsigned.zip
          if-no-files-found: error
          retention-days: 30
